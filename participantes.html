<!doctype html>
<html lang="es">
  <head>
    <title>Participantes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Consorcio del Grupo Operativo Fagoporc: CTAEX, Ibergenética Extremeña y Piensos Costa, con financiación PEPAC del MAPA."
    />
    <link rel="preload" href="/src/assets/fonts/CarmenSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/Bubbleboy.woff2" as="font" type="font/woff2" crossorigin />  </head>

  <body>

    <header class="header"></header>

    <main id="contenido" tabindex="-1">
      <section class="page-hero">
        <figure class="page-hero__media">
          <img
            src="/src/assets/img-hero.webp"
            srcset="/src/assets/img-hero-800.webp 800w, /src/assets/img-hero.webp 1600w"
            sizes="100vw"
            alt=""
            width="1600"
            height="644"
            fetchpriority="high"
            decoding="async"
          />
        </figure>

        <div class="wrap">
          <div class="page-hero__body">
            <div class="page-hero__intro">
              <nav class="page-hero__crumbs" aria-label="Migas de pan">
                <a href="index.html">Inicio</a>
                <span class="page-hero__sep" aria-hidden="true">/</span>
                <span aria-current="page">Participantes</span>
              </nav>
              <h1 class="page-hero__title">Participantes</h1>
            </div>
            <p class="page-hero__lead">
              Un centro tecnológico y dos empresas del sector porcino que
              recorren el ciclo completo, del fago al cebadero
            </p>
          </div>
        </div>
      </section>

      <section class="consorcio">
        <div class="wrap">
          <article class="socio">
            <div class="socio__logo">
              <img src="/src/assets/logo-cetaex.webp" alt="CTAEX" width="283" height="236" loading="lazy" decoding="async">
            </div>
            <div class="socio__body">
              <p class="label socio__label">Coordinador</p>
              <h2 class="socio__name">CTAEX</h2>
              <a class="socio__role" href="https://ctaex.com/" target="_blank" rel="noopener noreferrer">
                Visita la web
                <span class="socio__role-arrow" aria-hidden="true">&rarr;</span>
              </a>
            </div>
          </article>

          <article class="socio">
            <div class="socio__logo socio__logo--placeholder" aria-hidden="true">IE</div>
            <div class="socio__body">
              <p class="label socio__label">Socio</p>
              <h2 class="socio__name">Ibergenética Extremeña</h2>
              <a class="socio__role" href="#" target="_blank" rel="noopener noreferrer">
                Visita la web
                <span class="socio__role-arrow" aria-hidden="true">&rarr;</span>
              </a>
            </div>
          </article>

          <article class="socio">
            <div class="socio__logo">
              <img src="/src/assets/logo-piensos-costa.webp" alt="Piensos Costa" width="480" height="373" loading="lazy" decoding="async">
            </div>
            <div class="socio__body">
              <p class="label socio__label">Socio</p>
              <h2 class="socio__name">Piensos Costa</h2>
              <a class="socio__role" href="https://costafood.com/piensos-costa/" target="_blank" rel="noopener noreferrer">
                Visita la web
                <span class="socio__role-arrow" aria-hidden="true">&rarr;</span>
              </a>
            </div>
          </article>
        </div>
      </section>

    </main>

    <aside data-share></aside>

    <footer class="footer"></footer>

    <script type="module" src="/src/pages/participantes.js"></script>
  </body>
</html>
